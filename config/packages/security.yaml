security:
    role_hierarchy:
        ROLE_ORGANISATEUR: ROLE_USER
        ROLE_ADMIN:        ROLE_ORGANISATEUR

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_home

    access_control:
        - { path: ^/evenements/nouveau,        roles: ROLE_ORGANISATEUR }
        - { path: ^/evenements/\d+/modifier,   roles: ROLE_ORGANISATEUR }
        - { path: ^/evenements/\d+/supprimer,  roles: ROLE_ORGANISATEUR }
        - { path: ^/evenements/\d+/inscription, roles: ROLE_USER }
        - { path: ^/lieux/nouveau,             roles: ROLE_ADMIN }
        - { path: ^/lieux/\d+/modifier,        roles: ROLE_ADMIN }
        - { path: ^/lieux/\d+/supprimer,       roles: ROLE_ADMIN }
        - { path: ^/tags/nouveau,              roles: ROLE_ADMIN }
        - { path: ^/tags/\d+/modifier,         roles: ROLE_ADMIN }
        - { path: ^/tags/\d+/supprimer,        roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
